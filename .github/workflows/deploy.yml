name: deploy
on:
  push:
    branches: [main, sandbox]
    paths:
      - 'worker/**'
      # The Worker bundles its version from package.json (#175)
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

# One deploy per environment at a time; a newer push replaces a pending one
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

# Read-only token: the deploy talks to Cloudflare, not to GitHub (#226)
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Only a flag at job level; the token itself is passed only to the
      # wrangler steps, so npm install scripts and tests never see it (#226)
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      # main is production; every other branch (sandbox, or a manual run) is the sandbox (#134)
      TARGET: ${{ github.ref_name == 'main' && 'production' || 'sandbox' }}
      BASE_URL: ${{ github.ref_name == 'main' && 'https://api.priceto.day' || 'https://pricedb-sandbox.whosane.workers.dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      # Skipped when the CLOUDFLARE_API_TOKEN secret is missing, e.g. in forks
      - name: Apply D1 migrations
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply DB --remote --env "$TARGET"

      - name: Deploy
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env "$TARGET" --var "GIT_COMMIT:$GITHUB_SHA"

      - name: Smoke test
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        run: |
          sleep 10
          curl --fail --silent --show-error "$BASE_URL/v1/symbols" > /dev/null
          curl --fail --silent --show-error "$BASE_URL/v1/latest/irr/usd" > /dev/null
