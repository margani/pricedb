name: deploy
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'package-lock.json'
  workflow_dispatch:

# One deploy at a time; a newer push replaces a pending one
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      # Skipped until the CLOUDFLARE_API_TOKEN secret exists (#128)
      - name: Apply D1 migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: npx wrangler d1 migrations apply DB --remote --env production

      - name: Deploy to api.priceto.day
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: npx wrangler deploy --env production

      - name: Smoke test
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          sleep 10
          curl --fail --silent --show-error https://api.priceto.day/v1/symbols > /dev/null
          curl --fail --silent --show-error https://api.priceto.day/v1/latest/irr/usd > /dev/null
