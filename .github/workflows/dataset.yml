name: dataset
on:
  workflow_dispatch:
  schedule:
    # 1st of each month; the data itself lives in D1 behind the API. GitHub
    # drops scheduled runs under load, most often on the hour: the 03:00 run of
    # 2026-11-01 never started (#248). So: off the hour, a second try later
    # that day and one on the 2nd; a run that finds this month's release skips.
    - cron: '17 3 1 * *'
    - cron: '43 11 1 * *'
    - cron: '29 4 2 * *'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Skip when this month's release exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month="dataset-$(date -u +%Y-%m)-"
          if [ "${{ github.event_name }}" = schedule ] &&
            gh release list --repo "${{ github.repository }}" --limit 50 --json tagName --jq '.[].tagName' | grep -q "^$month"; then
            echo "A $month* release exists; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the dataset from the API
        if: steps.check.outputs.skip != 'true'
        run: |
          for granularity in daily hourly; do
            curl --fail --silent --show-error --retry 3 \
              "https://api.priceto.day/v1/dataset/$granularity.csv" -o "prices-$granularity.csv"
            # Header plus at least one row
            test "$(wc -l < "prices-$granularity.csv")" -gt 1
            gzip -9 "prices-$granularity.csv"
          done

      # One file per Persian year (#251): past years never change, the
      # current one grows each month. The data starts in 1402.
      - name: Download one file per Persian year
        if: steps.check.outputs.skip != 'true'
        run: |
          current=$(node -e 'console.log(new Intl.DateTimeFormat("en-u-ca-persian-nu-latn", { timeZone: "Asia/Tehran", year: "numeric" }).format(new Date()).replace(/\D/g, ""))')
          test "$current" -ge 1405
          for year in $(seq 1402 "$current"); do
            for granularity in daily hourly; do
              file="prices-$granularity-$year.csv"
              curl --fail --silent --show-error --retry 3 \
                "https://api.priceto.day/v1/dataset/$granularity.csv?year=$year" -o "$file"
              # A year with only the header has no data
              if [ "$(wc -l < "$file")" -gt 1 ]; then gzip -9 "$file"; else rm "$file"; fi
            done
          done
          ls -l prices-*.csv.gz

      - name: Publish a release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="dataset-$(date -u +%Y-%m-%d)"
          gh release create "$tag" prices-*.csv.gz \
            --repo "${{ github.repository }}" \
            --title "Price dataset $(date -u +%Y-%m-%d)" \
            --notes "Full price history of all tracked symbols as CSV (symbol,time,price,high,low). Times are UTC; prices are in each symbol's native unit (IRR for currencies, gold and coins). Daily = one record per trading day, hourly = every update (every 30 minutes during market hours) since 2023-12. prices-daily.csv.gz and prices-hourly.csv.gz hold the whole history; prices-daily-1404.csv.gz etc. hold one Persian year (Tehran time). Always the latest: https://github.com/margani/pricedb/releases/latest/download/prices-daily.csv.gz"
