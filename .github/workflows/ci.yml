name: ci
on:
  push:
    branches: [main]
  pull_request:

# Read-only token: tests and npm install scripts need no write access (#226)
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Validate openapi.yaml
        run: npm run lint:openapi
