<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>داشبورد قیمت | priceto.day</title>
<meta name="description" content="داشبورد جمع‌وجور قیمت دلار، یورو، پوند، طلا و سکه که هر چند ثانیه نماد بعدی را نشان می‌دهد.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2336a2eb'/><path d='M7 22l6-7 5 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#36a2eb">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<script>
  // Same as the other pages: saved theme and language before the stylesheet
  try {
    const theme = localStorage.getItem("theme");
    if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  } catch {}
  {
    let lang = null;
    try { lang = localStorage.getItem("lang"); } catch {}
    if (lang !== "fa" && lang !== "en") lang = (navigator.languages?.[0] || navigator.language || "").toLowerCase().startsWith("fa") ? "fa" : "en";
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
  }
</script>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1f2933; --muted: #6b7280; --line: #e5e7eb;
    --accent: #36a2eb; --up: #16a34a; --down: #dc2626; --fill: rgb(54 162 235 / 0.14);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0f1419; --card: #1a2027; --text: #e6e8eb; --muted: #9aa3ad; --line: #2a323b; --fill: rgb(54 162 235 / 0.2); color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #0f1419; --card: #1a2027; --text: #e6e8eb; --muted: #9aa3ad; --line: #2a323b; --fill: rgb(54 162 235 / 0.2); color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 Vazirmatn, system-ui, sans-serif; }
  .app { height: 100%; max-width: 1100px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  header a.home { color: var(--text); text-decoration: none; font-weight: 800; font-size: 18px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 14px; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn[hidden] { display: none; }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .panel { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px 24px 14px; cursor: pointer; position: relative; overflow: hidden; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .name { font-size: clamp(20px, 3.2vw, 30px); font-weight: 600; color: var(--muted); margin: 0; }
  .price { font-size: clamp(40px, 9vw, 96px); font-weight: 800; line-height: 1.1; margin: 4px 0; }
  .price small { font-size: 0.3em; font-weight: 400; color: var(--muted); margin-inline-start: 8px; }
  .changes { display: flex; gap: 10px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; font-size: clamp(14px, 1.8vw, 18px); color: var(--muted); }
  .chip b { font-weight: 600; }
  .up { color: var(--up); } .down { color: var(--down); }
  .when { color: var(--muted); font-size: 14px; text-align: end; }
  .chart { flex: 1; min-height: 140px; margin-top: 12px; position: relative; }
  /* LTR inside: text-anchor follows the inherited direction, and in RTL "end"
     pushed the price labels past the right edge, where they were cut off */
  .chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; direction: ltr; }
  .chart .axis { fill: var(--muted); font-size: 12px; }
  .chart .grid { stroke: var(--line); }
  .chart .line { stroke: var(--accent); stroke-width: 2.5; fill: none; vector-effect: non-scaling-stroke; }
  .chart .area { fill: var(--fill); }
  .progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 10px; }
  .progress div { height: 100%; width: 0; background: var(--accent); }
  .paused .progress div { background: var(--muted); }
  .paused-note { position: absolute; top: 12px; inset-inline-end: 16px; font-size: 13px; color: var(--muted); }
  .dots { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .dots button { font: inherit; font-size: 13px; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
  .dots button.active { color: #fff; background: var(--accent); border-color: var(--accent); }
  .update-banner { position: fixed; inset-inline: 12px; bottom: 12px; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 520px; margin-inline: auto; padding: 10px 14px; background: var(--card); color: var(--text); border: 1px solid var(--accent); border-radius: 12px; box-shadow: 0 6px 24px rgb(0 0 0 / 0.18); font-size: 14px; }
  .update-banner[hidden] { display: none; }
  .update-banner button { font: inherit; font-size: 14px; color: #fff; background: var(--accent); border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; flex: none; }
  body.has-update .app { padding-bottom: 80px; }
  @media (max-width: 520px) {
    .app { padding: 12px; }
    .panel { padding: 16px; }
    .when { text-align: start; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="home" href="/" data-i18n="title">قیمت امروز</a>
    <div class="tools">
      <button type="button" class="btn" id="install" hidden>نصب</button>
      <button type="button" class="btn" id="pause"></button>
      <button type="button" class="btn" id="fullscreen"></button>
      <button type="button" class="btn" id="lang" lang="en">English</button>
      <button type="button" class="btn" id="theme"></button>
    </div>
  </header>

  <main class="panel" id="panel" aria-live="polite">
    <span class="paused-note" id="paused-note" hidden></span>
    <div class="top">
      <div>
        <h1 class="name" id="name">…</h1>
        <div class="price" id="price">…</div>
        <div class="changes" id="changes"></div>
      </div>
      <div class="when" id="when"></div>
    </div>
    <div class="chart" id="chart"></div>
    <div class="progress"><div id="progress"></div></div>
  </main>

  <nav class="dots" id="dots"></nav>
</div>

<script>
  const I18N = {
    fa: {
      pageTitle: "داشبورد قیمت | priceto.day", title: "قیمت امروز",
      toman: "تومان", dollar: "دلار", day: "روز", week: "هفته", year: "۱ سال", percent: "٪",
      updated: "به‌روزرسانی", closed: "بازار تعطیل است", pause: "توقف", play: "ادامه", paused: "متوقف",
      fullscreen: "تمام‌صفحه", exitFullscreen: "خروج از تمام‌صفحه", theme: "تم", auto: "خودکار", light: "روشن", dark: "تیره",
      names: {
        usd: "دلار", euro: "یورو", gbp: "پوند", "gold-miskal": "مثقال طلا", "coin-emami": "سکه امامی",
        "coin-baharazadi": "سکه بهار آزادی", "coin-baharazadi-nim": "نیم سکه", "coin-baharazadi-rob": "ربع سکه", "coin-gerami": "سکه گرمی",
        "gold-18k": "طلای ۱۸ عیار (گرم)", "gold-24k": "طلای ۲۴ عیار (گرم)", "gold-ounce": "انس طلا", "silver-ounce": "انس نقره",
        brent: "نفت برنت", bitcoin: "بیت‌کوین", ethereum: "اتریوم", tether: "تتر",
        aed: "درهم امارات", try: "لیر ترکیه", cny: "یوان چین", cad: "دلار کانادا", aud: "دلار استرالیا",
      },
    },
    en: {
      pageTitle: "Price dashboard | priceto.day", title: "Prices today",
      toman: "toman", dollar: "USD", day: "Day", week: "Week", year: "1 year", percent: "%",
      updated: "Updated", closed: "market closed", pause: "Pause", play: "Play", paused: "Paused",
      fullscreen: "Fullscreen", exitFullscreen: "Exit fullscreen", theme: "Theme", auto: "Auto", light: "Light", dark: "Dark",
      names: {
        usd: "US dollar", euro: "Euro", gbp: "British pound", "gold-miskal": "Gold (mithqal)", "coin-emami": "Emami coin",
        "coin-baharazadi": "Bahar Azadi coin", "coin-baharazadi-nim": "Half coin", "coin-baharazadi-rob": "Quarter coin", "coin-gerami": "Gerami coin",
        "gold-18k": "18k gold (gram)", "gold-24k": "24k gold (gram)", "gold-ounce": "Gold ounce", "silver-ounce": "Silver ounce",
        brent: "Brent oil", bitcoin: "Bitcoin", ethereum: "Ethereum", tether: "Tether",
        aed: "UAE dirham", try: "Turkish lira", cny: "Chinese yuan", cad: "Canadian dollar", aud: "Australian dollar",
      },
    },
  };
  // World-market prices read better in dollars than in millions of toman
  const USD_BASED = new Set(["gold-ounce", "silver-ounce", "brent", "bitcoin", "ethereum"]);
  const DEFAULT_SYMBOLS = ["usd", "euro", "gbp", "gold-miskal", "coin-emami", "gold-ounce", "bitcoin"];
  const REFRESH_MS = 5 * 60 * 1000;

  const params = new URLSearchParams(location.search);
  const symbols = (params.get("symbols") || "").split(",").map((s) => s.trim().toLowerCase()).filter((s) => I18N.en.names[s]);
  const SYMBOLS = symbols.length ? symbols : DEFAULT_SYMBOLS;
  const INTERVAL_MS = Math.max(3, Number(params.get("interval")) || 8) * 1000;

  let lang = document.documentElement.lang === "fa" ? "fa" : "en";
  let t = I18N[lang];
  let index = 0;
  let paused = false;
  let data = {};
  let timer = null;
  let started = 0;
  let elapsedBeforePause = 0;

  const locale = () => (lang === "fa" ? "fa-IR" : "en-US");
  const baseOf = (symbol) => (USD_BASED.has(symbol) ? "usd" : "irr");
  const fmt = (n, digits = 0) => n.toLocaleString(locale(), { maximumFractionDigits: digits });
  const display = (symbol, value) => (baseOf(symbol) === "usd" ? fmt(value, value < 100 ? 2 : 0) : fmt(Math.round(value / 10)));

  async function load(symbol) {
    const base = baseOf(symbol);
    const from = new Date(Date.now() - 365 * 86400000).toISOString().slice(0, 10);
    const [change, history] = await Promise.all([
      fetch(`/v1/change/${base}/${symbol}?period=1d,7d`).then((r) => (r.ok ? r.json() : null)).catch(() => null),
      fetch(`/v1/history/${base}/${symbol}?from=${from}`).then((r) => (r.ok ? r.json() : null)).catch(() => null),
    ]);
    if (change) data[symbol] = { change, points: history?.result ?? [] };
  }

  async function refresh() {
    await Promise.all(SYMBOLS.map(load));
    render();
  }

  // The history has gaps; a change measured against a much older price misleads
  function chip(label, c, maxDays) {
    if (!c || c.changePercent == null || Date.now() - Date.parse(c.time) > maxDays * 86400000) return "";
    const cls = c.change > 0 ? "up" : c.change < 0 ? "down" : "";
    const sign = c.change > 0 ? "+" : "";
    return `<span class="chip">${label}: <b class="${cls}">${sign}${fmt(c.changePercent, 1)}${t.percent}</b></span>`;
  }

  function whenLabel(iso) {
    const when = new Intl.DateTimeFormat(locale(), { timeZone: "Asia/Tehran", weekday: "long", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(new Date(iso));
    const friday = new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Tehran", weekday: "short" }).format(new Date()) === "Fri";
    const old = Date.now() - Date.parse(iso) > 3 * 3600000;
    return `${t.updated}: ${when}${friday && old ? ` (${t.closed})` : ""}`;
  }

  function drawChart(symbol, points) {
    const box = document.getElementById("chart");
    if (points.length < 2) {
      box.innerHTML = "";
      return;
    }
    const w = box.clientWidth || 600;
    const h = box.clientHeight || 200;
    const pad = { top: 10, bottom: 22, side: 64 };
    const values = points.map((p) => p.price);
    let min = Math.min(...values);
    let max = Math.max(...values);
    if (min === max) { min *= 0.99; max *= 1.01; }
    const times = points.map((p) => Date.parse(p.time));
    const [t0, t1] = [times[0], times[times.length - 1]];
    // Time runs right to left in Persian, like the text
    const rtl = document.documentElement.dir === "rtl";
    const x = (time) => {
      const f = (time - t0) / (t1 - t0 || 1);
      return rtl ? w - pad.side - f * (w - 2 * pad.side) : pad.side + f * (w - 2 * pad.side);
    };
    const y = (v) => pad.top + (1 - (v - min) / (max - min)) * (h - pad.top - pad.bottom);
    const line = points.map((p, i) => `${i ? "L" : "M"}${x(times[i]).toFixed(1)},${y(p.price).toFixed(1)}`).join("");
    const baseY = h - pad.bottom;
    const area = `${line}L${x(t1).toFixed(1)},${baseY}L${x(t0).toFixed(1)},${baseY}Z`;
    const dateFmt = new Intl.DateTimeFormat(locale(), { timeZone: "Asia/Tehran", year: "numeric", month: "short" });
    const labelX = rtl ? w - 4 : 4;
    const anchor = rtl ? "end" : "start";
    box.innerHTML = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${t.names[symbol]} · ${t.year}">
      <line class="grid" x1="${pad.side}" x2="${w - pad.side}" y1="${y(max)}" y2="${y(max)}"/>
      <line class="grid" x1="${pad.side}" x2="${w - pad.side}" y1="${y(min)}" y2="${y(min)}"/>
      <path class="area" d="${area}"/>
      <path class="line" d="${line}"/>
      <text class="axis" x="${labelX}" y="${y(max) + 4}" text-anchor="${anchor}">${display(symbol, max)}</text>
      <text class="axis" x="${labelX}" y="${y(min) + 4}" text-anchor="${anchor}">${display(symbol, min)}</text>
      <text class="axis" x="${x(t0)}" y="${h - 4}" text-anchor="${rtl ? "end" : "start"}">${dateFmt.format(new Date(t0))}</text>
      <text class="axis" x="${x(t1)}" y="${h - 4}" text-anchor="${rtl ? "start" : "end"}">${dateFmt.format(new Date(t1))}</text>
    </svg>`;
  }

  function render() {
    const symbol = SYMBOLS[index];
    const entry = data[symbol];
    document.getElementById("name").textContent = t.names[symbol];
    if (entry) {
      const { change } = entry;
      const [day, week] = change.changes;
      const unit = baseOf(symbol) === "usd" ? t.dollar : t.toman;
      document.getElementById("price").innerHTML = `${display(symbol, change.price)}<small>${unit}</small>`;
      document.getElementById("changes").innerHTML = chip(t.day, day, 5) + chip(t.week, week, 11);
      document.getElementById("when").textContent = whenLabel(change.time);
      drawChart(symbol, entry.points);
    } else {
      document.getElementById("price").textContent = "…";
      document.getElementById("changes").innerHTML = "";
      document.getElementById("when").textContent = "";
      document.getElementById("chart").innerHTML = "";
    }
    document.getElementById("dots").innerHTML = SYMBOLS.map(
      (s, i) => `<button type="button" data-i="${i}" class="${i === index ? "active" : ""}">${t.names[s]}</button>`
    ).join("");
  }

  function show(i) {
    index = (i + SYMBOLS.length) % SYMBOLS.length;
    render();
    restartTimer();
  }

  function restartTimer() {
    clearTimeout(timer);
    elapsedBeforePause = 0;
    if (!paused) startProgress(INTERVAL_MS);
  }

  function startProgress(remaining) {
    const bar = document.getElementById("progress");
    started = Date.now() - (INTERVAL_MS - remaining);
    bar.style.transition = "none";
    bar.style.width = `${((INTERVAL_MS - remaining) / INTERVAL_MS) * 100}%`;
    bar.getBoundingClientRect();
    bar.style.transition = `width ${remaining}ms linear`;
    bar.style.width = "100%";
    timer = setTimeout(() => show(index + 1), remaining);
  }

  function setPaused(value) {
    paused = value;
    const bar = document.getElementById("progress");
    if (paused) {
      clearTimeout(timer);
      elapsedBeforePause = Math.min(Date.now() - started, INTERVAL_MS);
      bar.style.transition = "none";
      bar.style.width = `${(elapsedBeforePause / INTERVAL_MS) * 100}%`;
    } else {
      startProgress(INTERVAL_MS - elapsedBeforePause);
    }
    document.body.classList.toggle("paused", paused);
    renderControls();
  }

  const ICONS = {
    pause: '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>',
    play: '<path d="M7 5l12 7-12 7z"/>',
    fullscreen: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    auto: '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z"/>',
    light: '<circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    dark: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2"/>',
  };
  const icon = (name) => `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${ICONS[name]}</svg>`;

  function renderControls() {
    document.getElementById("pause").innerHTML = paused ? `${icon("play")}${t.play}` : `${icon("pause")}${t.pause}`;
    const fs = document.getElementById("fullscreen");
    fs.hidden = !document.fullscreenEnabled;
    fs.innerHTML = `${icon("fullscreen")}${document.fullscreenElement ? t.exitFullscreen : t.fullscreen}`;
    const theme = document.documentElement.dataset.theme || "auto";
    document.getElementById("theme").innerHTML = `${icon(theme)}${t[theme]}`;
    document.getElementById("theme").setAttribute("aria-label", `${t.theme}: ${t[theme]}`);
    const note = document.getElementById("paused-note");
    note.hidden = !paused;
    note.textContent = t.paused;
  }

  function renderLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
    document.title = t.pageTitle;
    document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t[el.dataset.i18n]));
    const other = lang === "fa" ? "en" : "fa";
    const langButton = document.getElementById("lang");
    langButton.textContent = other === "fa" ? "فارسی" : "English";
    langButton.lang = other;
    renderControls();
    render();
    document.dispatchEvent(new Event("langchange"));
  }

  document.getElementById("lang").addEventListener("click", (e) => {
    e.stopPropagation();
    lang = lang === "fa" ? "en" : "fa";
    t = I18N[lang];
    try { localStorage.setItem("lang", lang); } catch {}
    renderLang();
  });
  document.getElementById("theme").addEventListener("click", () => {
    const order = ["auto", "light", "dark"];
    const next = order[(order.indexOf(document.documentElement.dataset.theme || "auto") + 1) % order.length];
    if (next === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = next;
    try {
      if (next === "auto") localStorage.removeItem("theme");
      else localStorage.setItem("theme", next);
    } catch {}
    renderControls();
  });
  document.getElementById("pause").addEventListener("click", () => setPaused(!paused));
  document.getElementById("panel").addEventListener("click", () => setPaused(!paused));
  document.getElementById("fullscreen").addEventListener("click", () =>
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {})
  );
  document.addEventListener("fullscreenchange", renderControls);
  document.getElementById("dots").addEventListener("click", (e) => {
    const button = e.target.closest("button[data-i]");
    if (button) show(Number(button.dataset.i));
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === " ") {
      e.preventDefault();
      setPaused(!paused);
    }
    // "Next" points the way the text reads
    const forward = document.documentElement.dir === "rtl" ? "ArrowLeft" : "ArrowRight";
    const back = document.documentElement.dir === "rtl" ? "ArrowRight" : "ArrowLeft";
    if (e.key === forward) show(index + 1);
    if (e.key === back) show(index - 1);
  });
  window.addEventListener("resize", () => data[SYMBOLS[index]] && drawChart(SYMBOLS[index], data[SYMBOLS[index]].points));

  renderLang();
  refresh().then(restartTimer);
  setInterval(refresh, REFRESH_MS);
</script>
<script src="/pwa.js" defer></script>
</body>
</html>
